<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1c2a"><link rel="manifest" href="/manifest.webmanifest"><title>MKM • Fudbalski klub</title><style>

rder-radius:10px;padding:12px;margin:13px 0}.modalbg{position:fixed;inset:0;background:#091925a8;display:grid;place-items:center;padding:14px;z-index:30}.modal{background:white;max-width:560px;width:100%;max-height:92vh;overflow:auto;border-radius:17px;padding:23px}.modal h2{margin-top:0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.login{max-width:430px;margin:12vh auto;background:#fff;padding:32px;border-radius:19px;box-shadow:0 15px 60px #1f3f4818}.login h1{margin-bottom:4px}.pill{display:inline-block;padding:5px 9px;border-radius:18px;background:#e5f6ec;color:#176c4d;font-size:12px}.danger{background:#ffebe8;color:#a33122}.month{max-width:180px}.attrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e7eef2;gap:8px}.attrow select{max-width:175px;padding:8px}.empty{color:#788991;padding:18px;text-align:center}@media(max-width:850px){.side{width:178px}.main{padding:20px 15px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.layout{display:block}.side{width:100%;padding:12px;position:static}.brand{font-size:21px;margin:0 5px 8px}.menu{display:flex;gap:5px;overflow-x:auto}.menu button{white-space:nowrap;padding:9px}.main{padding:16px 12px 70px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:23px}.fields{grid-template-columns:1fr}.full{grid-column:1}}

/* MKM v0.9 — nenametljiv klupski identitet */
:root{color:#151f2d;background:#f3f6fa;--mkm-gold:#ffcc2e;--mkm-pink:#e73582;--mkm-dark:#111c2a;--mkm-border:#e5eaf0}
body{background:#f3f6fa;color:#172133}
.side{width:252px;background:linear-gradient(155deg,#101a26,#172330 72%,#0e1926);box-shadow:6px 0 28px #17233010;padding:25px 14px}
.brand{margin:4px 9px 24px;font-size:19px;letter-spacing:.025em}
.brand span{color:#9cabbc;font-size:11px;letter-spacing:.12em;margin-top:3px}
.mkm-crests{display:flex;gap:11px;align-items:center;margin:0 0 14px}
.mkm-crest{width:79px;height:79px;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;border-radius:50%;background:#ffcc2e;color:#131923;font-size:19px;font-weight:900;line-height:1.02;border:5px solid #161b20;box-shadow:0 0 0 2px #e5b521,0 4px 15px #0003}
.mkm-crest small{font-size:10px;letter-spacing:.08em;margin-top:6px}
.mkm-crest.pink{background:#eb3985;box-shadow:0 0 0 2px #d92c79,0 4px 15px #0003}
.menu{gap:7px}
.menu button{border-radius:10px;padding:13px 15px;font-weight:540;color:#ced7e2;transition:background .15s,color .15s}
.menu button:hover{background:#ffffff13;filter:none}
.menu button.active{background:var(--mkm-gold);color:#131a20;font-weight:750;box-shadow:0 3px 12px #ffcc2e25}
.main{max-width:1560px;padding:34px 36px 75px}
.header{padding:6px 0 12px;border-bottom:1px solid #e8edf2}
.header h1{font-size:clamp(27px,3vw,37px);letter-spacing:-.035em;margin:8px 0 5px;color:#101923}
.muted{color:#6d798a}
.card,.panel{border:1px solid var(--mkm-border);border-radius:16px;box-shadow:0 6px 22px #25395008}
.card{min-height:115px;padding:21px}
.card strong{font-size:30px;color:#121b27;letter-spacing:-.03em}
.panel{padding:23px;margin-top:18px}
.panel h2{font-size:20px;color:#14202e;letter-spacing:-.018em}
button{background:var(--mkm-gold);color:#182029;border-radius:9px;font-weight:750;padding:10px 15px}
button:hover{filter:brightness(.97)}
button.secondary{background:#f1f4f8;color:#263648;border:1px solid #e4e9ee}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e7358270;outline-offset:2px}
th{background:#f5f7fa;color:#657286;font-weight:750}
td,th{padding:13px 12px;border-color:#eaf0f4}
tbody tr:hover{background:#fafbfd}
.field input,.field select,input.search{border-color:#dce4ec;border-radius:9px}
.pill{background:#e7f6eb;color:#23794a;font-weight:650}
.pill.danger{background:#fce6ee;color:#ad2255}
.login{box-shadow:0 20px 70px #152c4218;border:1px solid #e5eaf0}
.login:before{content:"FK MKM  •  ŽFK MKM";display:block;font-weight:900;letter-spacing:.09em;color:#172330;background:linear-gradient(90deg,#ffcc2e 50%,#f6a2c8 50%);padding:13px;border-radius:10px;text-align:center;margin-bottom:16px}
@media(max-width:850px){.side{width:210px}.main{padding:24px 18px}.mkm-crest{width:65px;height:65px;font-size:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.side{width:100%;padding:12px}.brand{margin:4px 5px 10px}.mkm-crests{gap:8px;margin-bottom:9px}.mkm-crest{width:50px;height:50px;font-size:12px;border-width:3px}.mkm-crest small{font-size:8px;margin-top:2px}.main{padding:19px 12px 55px}.header h1{font-size:27px}.panel{padding:15px}.card{min-height:92px;padding:14px}.card strong{font-size:24px}}

/* Medical status: color reinforces, but does not replace the label. */
.med-status{display:inline-block;font-size:12px;font-weight:700;padding:6px 11px;border-radius:50px;white-space:nowrap}
.med-valid{background:#e7f6ec;color:#246e42}
.med-soon{background:#fff3d5;color:#966000}
.med-expired,.med-missing{background:#fbe5ed;color:#ad2455}
.med-cards .card{border-top:3px solid #e6ebf0}
.med-cards .card:nth-child(1){border-top-color:#65b985}
.med-cards .card:nth-child(2){border-top-color:#f4c647}
.med-cards .card:nth-child(3),.med-cards .card:nth-child(4){border-top-color:var(--mkm-pink)}
/* Keep navigation usable on phones and low-height displays. */
.menu button{min-height:43px}
@media(min-width:621px){.side{position:sticky;top:0;height:100vh;overflow-y:auto}}
@media(max-width:620px){.med-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div id="root"></div><script type="module" src="/app.js"></script></body></html>
